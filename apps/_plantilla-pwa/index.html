<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plantilla PWA</title>
  <meta name="description" content="Plantilla mínima de PWA offline para iPhone">
  <meta name="theme-color" content="#0f172a">

  <!-- iOS: modo app a pantalla completa al abrir desde la pantalla de inicio -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plantilla">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --accent: #22c55e;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Respetar notch / Dynamic Island / barra de inicio */
      padding: calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
               calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
      min-height: 100vh; min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .estado { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1; min-width: 0; padding: 12px; border-radius: 12px; border: 1px solid #334155;
      background: var(--card); color: var(--text); font-size: 16px; /* 16px evita zoom en iOS */
    }
    button {
      padding: 12px 16px; border: 0; border-radius: 12px; background: var(--accent);
      color: #052e16; font-weight: 600; font-size: 16px;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px;
      word-break: break-word;
    }
    li button { background: transparent; color: var(--muted); padding: 4px 8px; }
    .vacio { color: var(--muted); text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
  <h1>Plantilla PWA</h1>
  <div class="estado" id="estado">Cargando…</div>

  <form id="form" autocomplete="off">
    <input id="texto" placeholder="Nueva nota" aria-label="Nueva nota" required>
    <button type="submit">Añadir</button>
  </form>
  <ul id="lista"></ul>

  <script>
    // Datos en localStorage (solo en este dispositivo/navegador).
    const STORAGE_KEY = 'plantilla-pwa:notas';
    const $ = (id) => document.getElementById(id);

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    function save(items) { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

    function render() {
      const items = load();
      const ul = $('lista');
      ul.replaceChildren();
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'vacio';
        li.textContent = 'Sin notas todavía';
        ul.append(li);
        return;
      }
      items.forEach((item, i) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = item.text;
        const del = document.createElement('button');
        del.type = 'button';
        del.textContent = '✕';
        del.setAttribute('aria-label', 'Borrar');
        del.onclick = () => { const next = load(); next.splice(i, 1); save(next); render(); };
        li.append(span, del);
        ul.append(li);
      });
    }

    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('texto').value.trim();
      if (!text) return;
      save([{ text, at: new Date().toISOString() }, ...load()]);
      $('texto').value = '';
      render();
    });

    function updateStatus() {
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      $('estado').textContent =
        (navigator.onLine ? 'En línea' : 'Sin conexión') + ' · ' + (standalone ? 'App instalada' : 'Navegador');
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.error('SW error', err));
      });
    }

    updateStatus();
    render();
  </script>
</body>
</html>
